<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIA Prayer Hub 2026</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --gold: #fbbf24;
            --text: #f8fafc; --dim: #94a3b8; --accent: #22c55e;
            --alert-bg: rgba(248, 113, 113, 0.1); --alert-border: #f87171;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg);
            color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        .hero {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 25px; border-radius: 28px; text-align: center;
            border: 1px solid rgba(251, 191, 36, 0.2); margin-bottom: 20px;
        }
        .timer { font-size: 3.5rem; font-weight: 800; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .change-alert {
            background: var(--alert-bg); color: var(--alert-border);
            padding: 10px; border-radius: 12px; font-size: 0.85rem;
            border: 1px solid var(--alert-border); display: none; margin-top: 10px;
        }
        .prayer-card {
            background: var(--card); padding: 18px 20px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border: 2px solid transparent; transition: all 0.3s ease;
        }
        .current-prayer {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
            background: rgba(251, 191, 36, 0.05);
            transform: scale(1.02);
        }
        .p-ar { font-size: 1.3rem; color: var(--gold); font-weight: 600; }
        .t-adh { font-size: 1.5rem; font-weight: 700; }
        .t-iq { font-size: 0.85rem; color: var(--accent); font-weight: 600; }
        
        /* New Control Buttons */
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .btn-ui {
            background: var(--card); color: var(--gold); border: 1px solid var(--gold);
            padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.75rem; font-weight: bold;
        }
        .btn-ui.active { background: var(--gold); color: var(--bg); }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="soundToggle" class="btn-ui" onclick="toggleSound()">🔊 Audio On</button>
        <button class="btn-ui" onclick="testAthan()">⚡ Test Athan</button>
        <button id="janazahBtn" class="btn-ui" onclick="toggleJanazah()">⚰️ Janazah Off</button>
    </div>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <div id="today-gre" style="font-weight: bold; font-size: 1.2rem;"></div>
        <div id="today-hj" style="color: var(--gold);"></div>
    </div>

    <div class="hero">
        <div id="next-label" style="font-size: 0.8rem; color: var(--gold); letter-spacing: 1px;">NEXT PRAYER IN</div>
        <div class="timer" id="countdown">00:00:00</div>
        <div class="change-alert" id="iqamah-alert">
            ⚠️ <span id="alert-text"></span>
        </div>
    </div>

    <div id="prayer-list"></div>
</div>

<audio id="athanAudio" src="https://raw.githubusercontent.com/amerie2013/PrayerTime/amerie2013-Palestine_IsAldeen_Amarna/Palestine_IsAldeen_Amarna.mp3"></audio>

<script>
    let isMuted = true;
    let isJanazahMode = false;
    const audio = document.getElementById('athanAudio');

    // Sample Data from PDF sources
    const prayerData = {
        "2026-02-25": { hj: "8 Ramadan", times: ["05:48", "07:09", "12:45", "15:43", "18:10", "19:25"], iq: ["6:08", "-", "1:00", "4:30", "6:20", "7:45"] },
        "2026-02-26": { hj: "9 Ramadan", times: ["05:47", "07:07", "12:46", "15:44", "18:12", "19:26"], iq: ["6:07", "-", "1:00", "4:30", "6:22", "7:45"] }
    };

    const names = [
        { en: "Fajr", ar: "الفجر" }, { en: "Sunrise", ar: "الشروق" },
        { en: "Dhuhr", ar: "الظهر" }, { en: "Asr", ar: "العصر" },
        { en: "Maghrib", ar: "المغرب" }, { en: "Isha", ar: "العشاء" }
    ];

    function toggleSound() {
        isMuted = !isMuted;
        const btn = document.getElementById('soundToggle');
        btn.innerText = isMuted ? "🔇 Silent" : "🔊 Audio On";
        btn.classList.toggle('active', !isMuted);
        if(isMuted) audio.pause();
    }

    function testAthan() {
        audio.currentTime = 0;
        audio.play().catch(e => alert("Please click 'Audio On' first to allow sound."));
    }

    function toggleJanazah() {
        isJanazahMode = !isJanazahMode;
        document.getElementById('janazahBtn').innerText = isJanazahMode ? "⚰️ Janazah ON" : "⚰️ Janazah Off";
        document.getElementById('janazahBtn').classList.toggle('active', isJanazahMode);
        updateApp();
    }

    function updateApp() {
        const now = new Date();
        const dateKey = now.toISOString().split('T')[0];
        const today = prayerData[dateKey] || prayerData["2026-02-25"];

        document.getElementById('today-gre').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        document.getElementById('today-hj').innerText = today.hj + " 1447";

        const list = document.getElementById('prayer-list');
        list.innerHTML = "";
        
        let nextIndex = -1;
        const currentStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

        today.times.forEach((time, i) => {
            const isNext = (nextIndex === -1 && time > currentStr);
            if (isNext) nextIndex = i;

            // Apply Janazah Rule from PDF: Dhuhr Iqamah shifts to 01:50 PM during DST [cite: 510, 548, 920, 955]
            let iqamahDisplay = today.iq[i];
            if (isJanazahMode && names[i].en === "Dhuhr") iqamahDisplay = "1:50*";

            list.innerHTML += `
                <div class="prayer-card ${isNext ? 'current-prayer' : ''}">
                    <div style="display: flex; flex-direction: column;">
                        <span class="p-ar">${names[i].ar}</span>
                        <span style="font-size: 0.9rem;">${names[i].en}</span>
                    </div>
                    <div style="text-align: right;">
                        <div class="t-adh">${time.replace(/^0/, '')}</div>
                        <div class="t-iq">${today.iq[i] !== "-" ? "Iqamah " + iqamahDisplay : ""}</div>
                    </div>
                </div>`;
        });

        if (nextIndex !== -1) {
            const nextTimeArr = today.times[nextIndex].split(':');
            const target = new Date();
            target.setHours(nextTimeArr[0], nextTimeArr[1], 0);
            
            const diff = target - now;
            if (diff <= 1000 && diff > 0 && !isMuted && names[nextIndex].en !== "Sunrise") audio.play();

            const h = Math.floor(diff / 3600000).toString().padStart(2,'0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2,'0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2,'0');
            
            document.getElementById('countdown').innerText = `${h}:${m}:${s}`;
            document.getElementById('next-label').innerText = `NEXT: ${names[nextIndex].en} / ${names[nextIndex].ar}`;
        }
    }

    setInterval(updateApp, 1000);
    updateApp();
</script>
</body>
</html>
