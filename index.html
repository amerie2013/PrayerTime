<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIA Prayer Hub 2026</title>
    <style>
        :root {
            /* Dark Theme (Default) */
            --bg: #0f172a; --card: #1e293b; --gold: #fbbf24;
            --text: #f8fafc; --dim: #94a3b8; --accent: #22c55e;
            --alert-bg: rgba(248, 113, 113, 0.1); --alert-border: #f87171;
        }
        [data-theme="light"] {
            --bg: #f1f5f9; --card: #ffffff; --gold: #b45309;
            --text: #1e293b; --dim: #64748b; --accent: #15803d;
            --alert-bg: #fee2e2; --alert-border: #ef4444;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg);
            color: var(--text); margin: 0; padding: 20px; transition: 0.3s;
        }
        .container { width: 100%; max-width: 480px; margin: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Settings Dropdown */
        .settings-container { position: relative; }
        .settings-btn { background: var(--card); border: 1px solid var(--dim); color: var(--text); padding: 8px; border-radius: 8px; cursor: pointer; }
        .dropdown {
            display: none; position: absolute; right: 0; top: 45px; background: var(--card);
            border: 1px solid var(--dim); border-radius: 12px; width: 200px; padding: 15px; z-index: 1000;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .dropdown.show { display: block; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.9rem; }

        .hero {
            background: linear-gradient(135deg, var(--card) 0%, var(--bg) 100%);
            padding: 25px; border-radius: 28px; text-align: center;
            border: 1px solid var(--gold); margin-bottom: 20px;
        }
        .timer { font-size: 3.5rem; font-weight: 800; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .change-alert {
            background: var(--alert-bg); color: var(--alert-border);
            padding: 10px; border-radius: 12px; font-size: 0.85rem;
            border: 1px solid var(--alert-border); display: none;
        }
        .prayer-card {
            background: var(--card); padding: 18px 20px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border: 2px solid transparent;
        }
        .current-prayer { border-color: var(--gold); box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
        .p-ar { font-size: 1.3rem; color: var(--gold); font-weight: 600; }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <div class="top-bar">
        <div style="font-weight: bold; color: var(--gold);">INTEGRATION ACADEMY</div>
        <div class="settings-container">
            <button class="settings-btn" onclick="toggleDropdown()">⚙️ Settings</button>
            <div id="settingsMenu" class="dropdown">
                <div class="setting-item">
                    <span>Dark Mode</span>
                    <input type="checkbox" id="themeToggle" checked onclick="toggleTheme()">
                </div>
                <div class="setting-item">
                    <span>Activate Athan</span>
                    <input type="checkbox" id="athanToggle" onclick="enableAudio()">
                </div>
                <button style="width:100%" class="settings-btn" onclick="testAudio()">Test Athan</button>
            </div>
        </div>
    </div>

    <div class="hero">
        <div id="next-label" style="font-size: 0.8rem; color: var(--gold);">NEXT PRAYER IN</div>
        <div class="timer" id="countdown">00:00:00</div>
        <div class="change-alert" id="iqamah-alert">⚠️ <span id="alert-text"></span></div>
    </div>

    <div id="prayer-list"></div>
</div>

<audio id="athanAudio" src="https://raw.githubusercontent.com/amerie2013/PrayerTime/amerie2013-Palestine_IsAldeen_Amarna/Palestine_IsAldeen_Amarna.mp3"></audio>

<script>
    let audioActivated = false;
    const athanUrl = "https://raw.githubusercontent.com/amerie2013/PrayerTime/amerie2013-Palestine_IsAldeen_Amarna/Palestine_IsAldeen_Amarna.mp3";

    // Today is Feb 26, 2026 based on sources
    const prayerData = {
        "2026-02-26": { hj: "9 Ramadan", times: ["05:47", "07:07", "12:46", "15:44", "18:12", "19:26"], iq: ["6:07", "-", "1:00", "4:30", "6:22", "7:45"] },
        "2026-02-27": { hj: "10 Ramadan", times: ["05:45", "07:06", "12:46", "15:45", "18:13", "19:28"], iq: ["6:05", "-", "1:00", "4:30", "6:23", "7:45"] }
    };

    const names = [
        { en: "Fajr", ar: "الفجر" }, { en: "Sunrise", ar: "الشروق" },
        { en: "Dhuhr", ar: "الظهر" }, { en: "Asr", ar: "العصر" },
        { en: "Maghrib", ar: "المغرب" }, { en: "Isha", ar: "العشاء" }
    ];

    function toggleDropdown() { document.getElementById('settingsMenu').classList.toggle('show'); }
    
    function toggleTheme() {
        const isDark = document.getElementById('themeToggle').checked;
        document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
    }

    function enableAudio() {
        audioActivated = document.getElementById('athanToggle').checked;
        if(audioActivated) {
            const audio = document.getElementById('athanAudio');
            audio.play().then(() => audio.pause()); // Unlock audio for mobile
        }
    }

    function testAudio() {
        const audio = document.getElementById('athanAudio');
        audio.currentTime = 0;
        audio.play().catch(() => alert("Activate 'Athan' in settings first!"));
    }

    function updateApp() {
        const now = new Date();
        const dateKey = now.toISOString().split('T')[0];
        const today = prayerData[dateKey] || prayerData["2026-02-26"];

        document.getElementById('today-gre').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        document.getElementById('today-hj').innerText = today.hj + " 1447";

        let nextIndex = -1;
        const currentStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

        const list = document.getElementById('prayer-list');
        list.innerHTML = "";
        today.times.forEach((time, i) => {
            const isNext = (nextIndex === -1 && time > currentStr);
            if (isNext) nextIndex = i;

            list.innerHTML += `
                <div class="prayer-card ${isNext ? 'current-prayer' : ''}">
                    <div style="display: flex; flex-direction: column;">
                        <span class="p-ar">${names[i].ar}</span>
                        <span style="font-size: 0.9rem;">${names[i].en}</span>
                    </div>
                    <div style="text-align: right;">
                        <div class="t-adh">${time.replace(/^0/, '')}</div>
                        <div class="t-iq">${today.iq[i] !== "-" ? "Iqamah " + today.iq[i] : ""}</div>
                    </div>
                </div>`;
        });

        if (nextIndex !== -1) {
            const target = new Date();
            const [h, m] = today.times[nextIndex].split(':');
            target.setHours(h, m, 0);
            const diff = target - now;

            if (diff <= 1000 && diff > 0 && audioActivated && names[nextIndex].en !== "Sunrise") {
                document.getElementById('athanAudio').play();
            }

            const hh = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const mm = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const ss = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('countdown').innerText = `${hh}:${mm}:${ss}`;
        }
    }

    setInterval(updateApp, 1000);
    updateApp();
</script>
</body>
</html>
